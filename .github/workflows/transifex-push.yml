
name: Push Translations to Transifex

on:
  push:
    branches:
      - "3.15"
    paths:
      - "**/*.po"

  workflow_dispatch:
    inputs:
      push_translations:
        description: "Push Punjabi translations to Transifex"
        required: true
        type: boolean
        default: true
      push_sources:
        description: "Generate and push CPython source templates"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: transifex-push-${{ github.ref }}
  cancel-in-progress: false

env:
  TX_CLI_VERSION: "1.6.16"
  TX_PROJECT: python-newest
  TX_LANGUAGE: pa
  CPYTHON_VERSION: "3.15"

jobs:
  push-translations:
    name: Push Punjabi translations
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || inputs.push_translations)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout translation repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install configuration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          python -m pip install requests cogapp polib transifex-python sphinx-intl blurb six

      - name: Generate Transifex configuration
        run: |
          curl -fsSLO https://raw.githubusercontent.com/python-docs-translations/transifex-automations/main/sample-workflows/transifex-util.py
          chmod +x transifex-util.py
          ./transifex-util.py recreate_tx_config \
            --language "$TX_LANGUAGE" \
            --project-slug "$TX_PROJECT" \
            --version "$CPYTHON_VERSION"

      - name: Validate custom builtins resource mappings
        run: |
          python - <<'PY'
          import configparser
          from pathlib import Path

          path = Path(".tx/config")
          if not path.is_file():
              raise SystemExit("ERROR: .tx/config was not generated")

          config = configparser.ConfigParser()
          config.read(path)

          expected = {
              "builtins--constants",
              "builtins--exceptions",
              "builtins--functions",
              "builtins--index",
              "builtins--stdtypes",
              "builtins--threadsafety",
              "builtins--time-complexity",
          }

          resources = {
              section.rsplit(":r:", 1)[-1]
              for section in config.sections()
              if ":r:" in section
          }
          missing = expected - resources

          if missing:
              raise SystemExit(
                  "ERROR: generated config is missing custom builtins resources: "
                  + ", ".join(sorted(missing))
              )

          print("All seven custom builtins resource mappings are present.")
          PY

      - name: Install Transifex CLI
        working-directory: /usr/local/bin
        run: |
          curl -fsSL https://raw.githubusercontent.com/transifex/cli/master/install.sh | bash -s -- "v${TX_CLI_VERSION}"

      - name: Push Punjabi translations
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: |
          tx push --translation --languages "$TX_LANGUAGE" --use-git-timestamps

  push-sources:
    name: Generate and push source templates
    needs: push-translations
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.push_sources && (needs.push-translations.result == 'success' || needs.push-translations.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout translation repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout CPython source
        uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: "3.15"
          path: cpython
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          python -m pip install -r cpython/Doc/requirements.txt
          python -m pip install requests cogapp polib transifex-python sphinx-intl blurb six

      - name: Generate gettext source templates
        run: |
          make -C cpython/Doc gettext
          test -d cpython/Doc/build/gettext
          mkdir -p gettext
          cp -a cpython/Doc/build/gettext/. gettext/

      - name: Generate Transifex configuration
        run: |
          curl -fsSLO https://raw.githubusercontent.com/python-docs-translations/transifex-automations/main/sample-workflows/transifex-util.py
          chmod +x transifex-util.py
          ./transifex-util.py recreate_tx_config \
            --language "$TX_LANGUAGE" \
            --project-slug "$TX_PROJECT" \
            --version "$CPYTHON_VERSION"

      - name: Validate configured source templates
        run: |
          python - <<'PY'
          import configparser
          from pathlib import Path

          path = Path(".tx/config")
          if not path.is_file():
              raise SystemExit("ERROR: .tx/config was not generated")

          config = configparser.ConfigParser()
          config.read(path)

          missing = []
          for section in config.sections():
              source = config.get(section, "source_file", fallback="").strip()
              if source and not Path(source).is_file():
                  missing.append(f"{section}: {source}")

          if missing:
              print("Missing source templates:")
              print("\n".join(missing))
              raise SystemExit(1)

          print("All configured source templates exist.")
          PY

      - name: Install Transifex CLI
        working-directory: /usr/local/bin
        run: |
          curl -fsSL https://raw.githubusercontent.com/transifex/cli/master/install.sh | bash -s -- "v${TX_CLI_VERSION}"

      - name: Push source templates
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: |
          tx push --source --skip
